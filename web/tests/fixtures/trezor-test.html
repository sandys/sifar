<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trezor Test Harness</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 24px;
        background: #f6f1e8;
        color: #0a0a0a;
      }
      .card {
        background: white;
        border-radius: 16px;
        padding: 16px;
        border: 1px solid #f2e1c5;
        max-width: 520px;
      }
      .stack {
        display: grid;
        gap: 8px;
      }
      button {
        border-radius: 10px;
        border: 1px solid #f2e1c5;
        padding: 8px 12px;
        background: #ff5a3d;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: #2b2f36;
      }
      input {
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #f2e1c5;
        width: 80px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card stack">
      <div>
        Transport: <span id="transport" class="mono">webusb</span>
      </div>
      <div>
        <label>
          Start index
          <input id="startIndex" type="number" value="0" />
        </label>
        <label style="margin-left: 12px;">
          Count
          <input id="count" type="number" value="3" />
        </label>
      </div>
      <div>
        <button id="init" data-testid="init">Init</button>
        <button id="fetch" class="secondary" data-testid="fetch">
          Fetch Addresses
        </button>
      </div>
      <div data-testid="status" id="status">Idle</div>
      <div data-testid="error" id="error" style="color: #ff5a3d"></div>
      <div id="addresses" class="stack"></div>
    </div>

    <script type="module">
      const transportState = {
        transport: null,
        session: null,
        descriptor: null,
        messages: null,
        TREZOR_USB_DESCRIPTORS: null
      };

      const HARDENED = 0x80000000;

      const parsePath = (path) => {
        const cleaned = path.replace(/^m\//i, '');
        if (!cleaned) return [];
        return cleaned.split('/').map((segment) => {
          const hardened = segment.endsWith("'") || segment.endsWith('h');
          const value = Number.parseInt(segment.replace(/['h]/g, ''), 10);
          return hardened ? value | HARDENED : value;
        });
      };

      function setStatus(value) {
        document.getElementById('status').textContent = value;
      }

      function setError(value) {
        document.getElementById('error').textContent = value || '';
      }

      function setAddresses(list) {
        const container = document.getElementById('addresses');
        container.innerHTML = '';
        list.forEach((address) => {
          const div = document.createElement('div');
          div.className = 'mono';
          div.textContent = address;
          div.setAttribute('data-testid', 'address-item');
          container.appendChild(div);
        });
      }

      async function loadTransport() {
        if (transportState.transport) return transportState.transport;
        const module = await import(
          'https://cdn.jsdelivr.net/npm/@trezor/transport@1.6.1/+esm'
        );
        transportState.TREZOR_USB_DESCRIPTORS = module.TREZOR_USB_DESCRIPTORS;
        const messages = await fetch(
          'https://cdn.jsdelivr.net/npm/@trezor/protobuf@1.5.1/messages.json'
        ).then((res) => res.json());
        transportState.messages = messages;
        transportState.transport = new module.WebUsbTransport({
          messages,
          id: 'vault-bridge-test'
        });
        await transportState.transport.init();
        transportState.transport.listen();
        return transportState.transport;
      }

      async function ensureSession() {
        if (transportState.session) return transportState.session;
        const transport = transportState.transport;
        const enumerated = await transport.enumerate();
        if (!enumerated.success || !enumerated.payload.length) {
          throw new Error('No devices detected');
        }
        const descriptor = enumerated.payload[0];
        const acquired = await transport.acquire({
          input: { path: descriptor.path, previous: descriptor.session ?? null }
        });
        if (!acquired.success) {
          throw new Error(acquired.error || 'Failed to acquire session');
        }
        transportState.session = acquired.payload;
        transportState.descriptor = descriptor;
        await callWithUi('Initialize', {});
        return transportState.session;
      }

      async function callWithUi(name, data) {
        let response = await transportState.transport.call({
          session: transportState.session,
          name,
          data
        });
        while (true) {
          if (!response.success) {
            throw new Error(response.error || 'Transport call failed');
          }
          const { type, message } = response.payload;
          if (type === 'Failure') {
            throw new Error(message?.message || 'Device failure');
          }
          if (type === 'ButtonRequest') {
            response = await transportState.transport.call({
              session: transportState.session,
              name: 'ButtonAck',
              data: {}
            });
            continue;
          }
          if (type === 'PinMatrixRequest') {
            const pin = window.prompt(
              'Enter PIN using the matrix shown on your Trezor'
            );
            if (!pin) throw new Error('PIN entry cancelled');
            response = await transportState.transport.call({
              session: transportState.session,
              name: 'PinMatrixAck',
              data: { pin }
            });
            continue;
          }
          if (type === 'PassphraseRequest') {
            const passphrase = window.prompt(
              'Enter passphrase (leave empty for none)'
            );
            response = await transportState.transport.call({
              session: transportState.session,
              name: 'PassphraseAck',
              data: { passphrase: passphrase || '' }
            });
            continue;
          }
          return response.payload;
        }
      }

      let initPromise = null;

      async function init() {
        if (initPromise) return initPromise;
        initPromise = (async () => {
          setStatus('Initializing');
          setError('');

          if (!navigator.usb) {
            throw new Error('WebUSB not supported');
          }

          await loadTransport();
          await navigator.usb.requestDevice({
            filters: transportState.TREZOR_USB_DESCRIPTORS
          });
          await ensureSession();

          setStatus('Initialized');
        })();

        try {
          await initPromise;
        } catch (err) {
          initPromise = null;
          throw err;
        }
      }

      async function fetchAddresses() {
        try {
          await init();
          setStatus('Fetching');
          setError('');

          const startIndex = Number(
            document.getElementById('startIndex').value
          );
          const count = Number(document.getElementById('count').value);

          const results = [];
          for (let i = 0; i < count; i += 1) {
            const index = startIndex + i;
            const path = `m/44'/501'/${index}'/0'`;
            const response = await callWithUi('SolanaGetAddress', {
              address_n: parsePath(path),
              show_display: false
            });

            if (response.type !== 'SolanaAddress') {
              throw new Error(`Unexpected response: ${response.type}`);
            }

            results.push(response.message.address);
          }

          setAddresses(results);
          setStatus('Fetched');
        } catch (err) {
          setStatus('Error');
          setError(err.message || 'Failed');
        }
      }

      document.getElementById('init').addEventListener('click', init);
      document.getElementById('fetch').addEventListener('click', fetchAddresses);
    </script>
  </body>
</html>
