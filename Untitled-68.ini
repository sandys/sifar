 ---
 Frontend Sentry Investigation Environment — Detailed Spec

 Environment source (frontend_sentry.py)

 Adapted from HUD's sentry.py (lines 67-96):

 @frontend_env.scenario("investigate")
 async def investigate_frontend_issue(
     query: str,
     must_include: list[str] | None = None,
     must_not_include: list[str] | None = None,
 ) -> Any:
     prompt = f"""You are a frontend debugging specialist using Sentry. Investigate:

 **Query:** {query}

 **IMPORTANT: This is a READ-ONLY investigation. Do NOT modify issues.**

 Use the available Sentry tools to:
 1. Search for JavaScript/React errors related to this report
 2. Get issue details including stack traces and breadcrumbs
 3. Examine the component tree and affected DOM elements
 4. Check browser/viewport metadata for rendering-specific issues
 5. Use Seer analysis if available for root cause

 Provide a detailed summary including:
 - Sentry Issue ID(s) found
 - The specific React component or CSS property causing the problem
 - Stack trace pointing to the source file and line
 - Browser/viewport conditions that trigger the bug
 - Root cause analysis (why the rendering fails)
 - Recommended code fix (file, line, what to change)"""

     response = yield prompt
     if not response:
         yield 0.0
         return
     response_lower = response.lower()
     score = 1.0
     if must_include:
         all_found = all(fact.lower() in response_lower for fact in must_include)
         score = 1.0 if all_found else 0.0
     if must_not_include and score > 0:
         has_mistake = any(bad.lower() in response_lower for bad in must_not_include)
         if has_mistake:
             score = 0.0
     yield score

 Task prompt design

 Each task has:
 - query: Realistic bug report — vague, mentions symptoms not causes. Agent must navigate Sentry to find the real issue.
 - must_include: Ground truth facts (Sentry issue ID, source file, CSS property, component name). We know these because we
 know the bug and the fix.
 - must_not_include: Confusers — similar issues the agent might latch onto by mistake.
 - difficulty: easy / medium / hard / expert.

 Difficulty calibration

 ┌────────────┬─────────────────────────────────────────────────────────┬───────────────────────────────────────────────┐
 │ Difficulty │                  What makes it harder                   │                    Example                    │
 ├────────────┼─────────────────────────────────────────────────────────┼───────────────────────────────────────────────┤
 │ easy       │ Single issue, obvious error, no confusers               │ "Badge looks square instead of round"         │
 ├────────────┼─────────────────────────────────────────────────────────┼───────────────────────────────────────────────┤
 │ medium     │ Must distinguish from similar issues                    │ "UI elements overlap but only on certain      │
 │            │                                                         │ pages"                                        │
 ├────────────┼─────────────────────────────────────────────────────────┼───────────────────────────────────────────────┤
 │ hard       │ Multiple related errors, root cause vs symptom          │ "Several CSS issues — which is the actual     │
 │            │                                                         │ regression?"                                  │
 ├────────────┼─────────────────────────────────────────────────────────┼───────────────────────────────────────────────┤
 │ expert     │ Exact values required, correlate across components,     │ "Find the exact CSS property value and the    │
 │            │ close confusers                                         │ commit"                                       │
 └────────────┴─────────────────────────────────────────────────────────┴───────────────────────────────────────────────┘

