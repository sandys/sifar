 Good vs bad responses

 Good response (score = 1.0):
 Agent uses Sentry tools → finds correct issue ID → names the file/component → identifies root cause → doesn't mention
 confusers → provides concrete fix recommendation.

 ▎ "Found issue MANTINE-BADGE (142 events). The Badge component in Badge.tsx doesn't override border-radius when the circle
  prop is used with a custom defaultProps radius. The theme sets radius to 'sm' as default, but the circle variant needs
 border-radius: 50% regardless. Fix is in packages/@mantine/core/src/components/Badge/Badge.tsx."

 Bad response (score = 0.0) — Missing facts:
 ▎ "Found some Badge rendering issues. The component looks wrong."
 ▎ → Missing: MANTINE-BADGE, border-radius, Badge.tsx

 Bad response (score = 0.0) — Confused with wrong issue:
 ▎ "Found issue MANTINE-MULTISELECT about padding..."
 ▎ → Contains must_not_include value MultiSelect

 Bad response (score = 0.0) — Hallucinated:
 ▎ "Found issue MANTINE-BADGE-X2. Problem is in Badge.styles.ts line 42..."
 ▎ → Wrong issue ID, wrong file

 Bad response (score = 0.0) — No tool usage:
 ▎ "Based on my knowledge, Badge circle issues are usually caused by CSS specificity..."
 ▎ → Didn't use Sentry tools, guessed from training data

 Seeding Sentry with real errors

 Pipeline: checkout broken commit → inject @sentry/react → build & serve → Playwright triggers bug → Sentry captures real
 events → query API → write tasks.

 // Injected into Mantine docs app entry point
 import * as Sentry from "@sentry/react";
 Sentry.init({
   dsn: "...",
   integrations: [Sentry.browserTracingIntegration(), Sentry.replayIntegration()],
   beforeSend(event) {
     // Capture computed styles of affected elements as custom context
     const el = document.querySelector('.mantine-Badge-root');
     if (el) {
       event.contexts = { ...event.contexts,
         css_debug: { border_radius: getComputedStyle(el).borderRadius }
       };
     }
     return event;
   }
 });

 Playwright triggers each bug:
 async def trigger_badge_bug(page):
     await page.goto("http://localhost:7545/core/badge")
     badge = page.locator(".mantine-Badge-root[data-circle]")
     radius = await badge.evaluate("el => getComputedStyle(el).borderRadius")
     if radius != "50%":
         await page.evaluate("""
             Sentry.captureMessage('Badge circle has wrong border-radius', {
                 level: 'error',
                 tags: { component: 'Badge', variant: 'circle' },
                 extra: { actual_border_radius: arguments[0] }
             })
         """, radius)

