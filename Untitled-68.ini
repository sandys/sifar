 Failure mode analysis (post-RFT)

 Categorize remaining failures:
 - Tool misuse: wrong Sentry tool / wrong bash command
 - Navigation error: right project, wrong issue / wrong file
 - Confusion: correct issue found but confuser data mixed in
 - Hallucination: invented issue IDs, file paths, CSS values
 - Incomplete: found some facts but stopped early
 - Infra: serve_failed, timeout, ChromiumRL unavailable

 This tells us where training worked and where more data is needed.

