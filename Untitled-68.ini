 ---
 Step 1: Run Eval — Get pass@5 on Sonnet 4.5 + ChatGPT

 What pass@5 means

 Run each task 5 times per model. For each task, report whether at least one of 5 attempts passes. This establishes how
 hard our tasks are for frontier models.

 If Sonnet gets 80% pass@5, tasks are too easy. If 10%, they're interesting training targets. HUD's Sentry showed o4-mini
 at 6.3% baseline — that's the difficulty sweet spot.

 Models to benchmark

 - Claude Sonnet 4.5 — claude-sonnet-4-5-20250514
 - Newest ChatGPT — gpt-4.1 or o4-mini

 How to run: Code-editing tasks (ChromiumRL)

 No Tinker needed for eval. Tinker is our DPO training backend. For eval, the model is just an agent making API calls. We
 route through our TinkerLLM proxy pointing at Anthropic API / OpenAI API instead of Tinker.

 # 1. Start infrastructure
 w8-rl-harbor-host up

 # 2. Convert all 5 tasks
 w8-rl-harbor-adapter --source w8_storage/github-arbitrary/tasks --output harbor_tasks/github-arbitrary \
   --task mantinedev__mantine-8590 --task mantinedev__mantine-8532 --task mantinedev__mantine-8622 --force

 # 3. Run 5 rollouts per task per model (eval-only, no DPO)
 w8-rl-harbor-probe --variance-probe-runs 1 --group-size 5 \
   --task-dir harbor_tasks/github-arbitrary/mantinedev__mantine-8466 \
   --task-dir harbor_tasks/github-arbitrary/mantinedev__mantine-8634 \
   ... (all 5) \
   --model-name "claude-sonnet-4-5-20250514" \
   --base-url "https://api.anthropic.com/..."  # or LiteLLM shim

 Scoring: Each rollout runs our full verifier pipeline: test.sh → ChromiumRL DOMdiff → rubric evaluation → raw_reward (0-1)
  and rubric_passed (0/1).

 Extract pass@5:
 # From probe results / rollout_summaries.jsonl
 # Each line: task_name, slot_idx, raw_reward, rubric_passed, terminal_state
 # pass@5 = 1 if ANY of 5 slots has rubric_passed == 1

 How to run: Investigation tasks (Sentry)

 # Using HUD SDK pattern
 hud eval "w8rl-frontend-sentry" claude-sonnet-4-5 --group-size 5
 hud eval "w8rl-frontend-sentry" gpt-4.1 --group-size 5

 # Or standalone with our environment:
 python environments/frontend_sentry.py --eval --model claude-sonnet-4-5 --group-size 5

 Scoring: Binary fact-matching (all must_include present, no must_not_include found → 1.0, else 0.0).

 Volume

 - Code-editing: 5 tasks × 5 attempts × 2 models = 50 rollouts (~10 min each = ~8 hrs)
 - Investigation: 24 tasks × 5 attempts × 2 models = 240 rollouts (~2 min each = ~8 hrs)
 - Total: ~290 rollouts, ~16 hours compute

 ---
 Step 2: Check for False Positives (autoQA)

 What it is

 Review trajectories to verify scoring is trustworthy. Catch false positives (pass but wrong) and false negatives (fail but
  correct).

 Code-editing QA (our artifacts)

 ┌─────────────────────────────┬────────────────────────────────────────────────────────────────────────┐
 │          Artifact           │                             What to check                              │
 ├─────────────────────────────┼────────────────────────────────────────────────────────────────────────┤
 │ rollout_summaries.jsonl     │ Per-slot: raw_reward, rubric_passed, domdiff subscores, terminal_state │
 ├─────────────────────────────┼────────────────────────────────────────────────────────────────────────┤
 │ tool_exec.jsonl             │ What the agent actually edited — verify against gold patch direction   │
 ├─────────────────────────────┼────────────────────────────────────────────────────────────────────────┤
 │ conversation_failures.jsonl │ Infra errors (serve_failed, timeout) — exclude from pass@k             │
 └─────────────────────────────┴────────────────────────────────────────────────────────────────────────┘

 QA process:
 1. For each pass rollout: does the agent's edit actually fix the bug? (Read tool_exec, check file changes match gold
 direction)
 2. For each fail: is it a real failure or infra flake? (Check terminal_state)
 3. Cross-check: high domdiff + failed assertions = superficial fix correctly caught; low domdiff + passed assertions =
 possible false positive
 4. Suspicious patterns to flag:
   - Pass with low domdiff (< 0.7) — assertion-only pass
   - Fail with high domdiff (> 0.9) — possible assertion bug
   - Zero tool calls — agent didn't try
   - Infra failures — exclude from pass@k denominator

 Investigation QA

 1. For each pass: did the agent actually use Sentry tools, or just guess from training data?
 2. For each fail: check which must_include fact was missing — is the task too strict?
 3. Check must_not_include failures — did the agent genuinely confuse issues, or did it mention the confuser in a "this is
 NOT the problem" context?
 4. Tune tasks if needed: adjust must_include/must_not_include based on false positive/negative analysis

 Output

 False positive rate per environment type — fraction of pass verdicts wrong on manual review. Target: < 5%.

 ---
 Step 3: RFT Ablation (DPO Training)

 What it proves

 Train a model on our environments, measure improvement. This proves environments produce learnable reward signal — the
 core value proposition for labs.

 Eval vs training — different models, different purpose

 ┌────────────────┬────────────────────────────────────────┬────────────────────────────┐
 │                │             Eval (Step 1)              │     Training (Step 3)      │
 ├────────────────┼────────────────────────────────────────┼────────────────────────────┤
 │ Models         │ Sonnet 4.5, ChatGPT (closed, frontier) │ Qwen3-4B (open, trainable) │
 ├────────────────┼────────────────────────────────────────┼────────────────────────────┤
 │ Purpose        │ Measure difficulty                     │ Prove learnability         │
 ├────────────────┼────────────────────────────────────────┼────────────────────────────┤
 │ Training?      │ No — pure inference                    │ Yes — DPO via Tinker       │
 ├────────────────┼────────────────────────────────────────┼────────────────────────────┤
 │ Tinker needed? │ No                                     │ Yes                        │
 └────────────────┴────────────────────────────────────────┴────────────────────────────┘

 You cannot RL-train Sonnet or ChatGPT — closed models. The ablation uses an open model (Qwen3-4B via Tinker, or o4-mini
 via OpenAI RFT).

 How to run: Code-editing ablation

 # Phase A: Baseline pass@5 on Qwen3-4B (before training)
 w8-rl-harbor-probe --admission-mode \
   --task-dir harbor_tasks/github-arbitrary/* \
   --model-name "Qwen/Qwen3-4B-Instruct-2507" \
   --group-size 5

 # Phase B: Train (DPO)
 w8-rl-harbor-train \
   --task-dir harbor_tasks/github-arbitrary/* \
   --model-name "Qwen/Qwen3-4B-Instruct-2507" \
   --group-size 4 --num-batches 10 \
   --dpo-beta 0.1 --learning-rate 1e-5

 # Phase C: Post-training pass@5
 # Re-eval with trained checkpoint, same tasks, group-size 5

 How to run: Investigation ablation

 Same model (Qwen3-4B via Tinker) or o4-mini (via OpenAI RFT if we get access):
 - Baseline: run investigation tasks N times, compute pass rates
 - Train: collect 3,000+ traces (HUD's benchmark), run DPO/RFT
 - Post-training: re-eval

