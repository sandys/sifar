 Full Spec: Frontend RL Environments — Eval, QA, RFT Ablation, Lab-Shopping

 Context

 An RL partner pitched a 4-step pipeline to validate and commercialize our environments. We're doing it ourselves using our
  Harbor stack + a new Sentry investigation environment.

 Reference case (HUD's Sentry): 24 backend ops investigation tasks, sentry-o4-mini trained via OpenAI RFT, 3,000+ traces,
 13 hours, 2x improvement (6.3% → 13%). Public repo: github.com/hud-evals/hud-ops-diagnostics.

 What we're building: Two complementary frontend environment types, then running the full eval → QA → RFT → lab-shopping
 pipeline on both.

